<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InventarioAPI</title><link rel="stylesheet" href="/static/app.css"></head><body><aside><h1>Inventario<span>API</span></h1><a href="#dashboard">Dashboard</a><a href="#productos">Productos</a><a href="#categorias">Categorías</a><a href="/api/docs/" target="_blank">Swagger ↗</a></aside><main><header><div><p>GESTIÓN DE INVENTARIO</p><h2>Vista general</h2></div><button id="new">+ Nuevo producto</button></header><section id="dashboard" class="cards"><article><small>Total productos</small><strong id="total">—</strong></article><article><small>Productos activos</small><strong id="activos">—</strong></article><article><small>Stock bajo</small><strong id="bajo">—</strong></article><article><small>Valor de inventario</small><strong id="valor">—</strong></article></section><section class="panel"><h3>Productos por categoría</h3><div id="chart"></div></section><section id="productos" class="panel"><div class="toolbar"><h3>Productos</h3><input id="search" placeholder="Buscar nombre, código…"><select id="estado"><option value="">Todos los estados</option><option value="true">Activos</option><option value="false">Inactivos</option></select></div><table><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="pages"></div></section><section id="categorias" class="panel"><h3>Categorías</h3><div id="catlist"></div></section></main><dialog id="modal"><form method="dialog" id="form"><h3 id="formtitle">Producto</h3><input name="codigo" placeholder="Código" required><input name="nombre" placeholder="Nombre" required><textarea name="descripcion" placeholder="Descripción"></textarea><select name="categoria" id="categoria" required></select><input name="precio" type="number" step=".01" min=".01" placeholder="Precio" required><input name="stock" type="number" min="0" placeholder="Stock" required><label><input name="activo" type="checkbox" checked> Activo</label><menu><button value="cancel">Cancelar</button><button id="save" value="default">Guardar</button></menu></form></dialog><div id="toast"></div><script src="/static/app.js"></script></body></html>
